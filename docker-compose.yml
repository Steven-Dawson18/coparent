services:
  postgres:
    image: postgres:18.6-alpine
    restart: always
    container_name: coparent-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prisma
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./coparent-backend
      dockerfile: dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:prisma@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "npx prisma migrate deploy &&
      npx prisma db execute --schema prisma/schema.prisma
      --file prisma/local/create-runtime-login.sql"

  backend:
    build:
      context: ./coparent-backend
      dockerfile: dockerfile
    container_name: coparent-backend
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://coparent_app:local-runtime-password@postgres:5432/postgres
      AUTH_MODE: local
      JWT_SECRET: local_development_only_secret_change_me
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000
      EMAIL_PROVIDER: development
      EMAIL_WORKER_ENABLED: "true"
      NOTIFICATION_WORKER_ENABLED: "true"
      EMAIL_OUTBOX_ENCRYPTION_KEY: bG9jYWwtZW1haWwtb3V0Ym94LWtleS0zMmJ5dGVzISE=
      FILE_STORAGE_ROOT: /app/private-storage
      FILE_STORAGE_ENCRYPTION_KEY: HNhMcYvnFwMBRDvfi2agPWoS1nW26aLjQLUg9FWgqXM=
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./coparent-backend:/app
      - backend_node_modules:/app/node_modules
      - backend_dist:/app/dist
      - document_storage:/app/private-storage
    command: >-
      sh -c "find /app/dist -mindepth 1 -depth -delete &&
      npx prisma generate &&
      npx nest start --watch --config nest-cli.docker.json"

volumes:
  pg_data:
  backend_node_modules:
  backend_dist:
  document_storage:
